{% extends "base.html" %}

{% block content %}

<div style="
    max-width:450px;
    margin:50px auto;
    padding:30px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px #ddd;
">

    <h2 style="text-align:center;">🔑 Forgot Password?</h2>

    <p style="text-align:center;color:#666;">
        Enter the email address associated with your account.
        We will send you a password reset link.
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            required
            style="
                width:100%;
                padding:10px;
                margin:8px 0 20px;
                box-sizing:border-box;
            "
        >

        <button
            type="submit"
            style="
                width:100%;
                padding:12px;
                background:#0d6efd;
                color:white;
                border:none;
                border-radius:6px;
                font-size:16px;
                cursor:pointer;
            "
        >
            📧 Send Reset Link
        </button>

    </form>

    <p style="text-align:center;margin-top:20px;">
        <a href="{% url 'login' %}">
            ← Back to Login
        </a>
    </p>

</div>

{% endblock %}
