{% extends "base.html" %}

{% block content %}

<div style="
    max-width:500px;
    margin:50px auto;
    padding:30px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px #ddd;
    text-align:center;
">

    <h2>📧 Check Your Email</h2>

    <p>
        If an account exists with the email address you entered,
        a password reset link has been sent.
    </p>

    <p style="color:#666;">
        Check your email and follow the link to create a new password.
    </p>

    <a href="{% url 'login' %}">
        ← Back to Login
    </a>

</div>

{% endblock %}
