{% extends "base.html" %}

{% block content %}

<div style="
    max-width:450px;
    margin:50px auto;
    padding:30px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px #ddd;
">

    {% if validlink %}

        <h2 style="text-align:center;">🔐 Set New Password</h2>

        <p style="text-align:center;color:#666;">
            Enter your new password below.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                style="
                    width:100%;
                    padding:12px;
                    background:#0d6efd;
                    color:white;
                    border:none;
                    border-radius:6px;
                    font-size:16px;
                    cursor:pointer;
                "
            >
                🔑 Change Password
            </button>

        </form>

    {% else %}

        <h2 style="text-align:center;">❌ Invalid Link</h2>

        <p style="text-align:center;">
            This password reset link is invalid or has already been used.
        </p>

        <p style="text-align:center;">
            <a href="{% url 'password_reset' %}">
                Request a new reset link
            </a>
        </p>

    {% endif %}

</div>

{% endblock %}
