{% extends "base.html" %}

{% block content %}

<div style="
    max-width:500px;
    margin:50px auto;
    padding:30px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px #ddd;
    text-align:center;
">

    <h2>✅ Password Changed!</h2>

    <p>
        Your password has been successfully changed.
    </p>

    <p>
        You can now log in with your new password.
    </p>

    <a
        href="{% url 'login' %}"
        style="
            display:inline-block;
            margin-top:15px;
            padding:12px 25px;
            background:#0d6efd;
            color:white;
            text-decoration:none;
            border-radius:6px;
        "
    >
        🔐 Login
    </a>

</div>

{% endblock %}
